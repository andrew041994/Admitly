name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admitly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admitly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/admitly_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/admitly_test
      ENV: test
      ENABLE_DEV_TEST_CHECKOUT: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Require exactly one migration head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {heads}")
          print(f"Migration head: {heads[0]}")
          PY
      - run: alembic upgrade head
      - run: PYTHONPATH=. python -m pytest
      - name: Production safety guards
        working-directory: .
        run: python scripts/verify_production_safety.py

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            admin/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
